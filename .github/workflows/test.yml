name: Test

# The formatter is built with the newest komp and kflat toolchain. kf.toml's
# `kflat` pin decides the toolchain: komp installs the one it names when the
# newest does not fit.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install komp and the newest kflat toolchain
        run: |
          curl -fsSL https://github.com/komp-co/komp/releases/latest/download/install.sh | sh
          echo "$HOME/.kflat/bin" >> "$GITHUB_PATH"

      - name: Unit tests
        run: komp test .

      - name: The formatter's own sources are formatted
        run: |
          komp build .
          target/kflat/komp_fmt --check src
